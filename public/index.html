<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0b" />
    <title>Geet Status</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand" aria-label="Geet status">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <span>geet<span class="brand-dot">.</span></span>
        </div>
        <span class="masthead-label">SYSTEM STATUS</span>
      </header>
      <section class="intro">
        <div>
          <p class="eyebrow">GEET SERVICE HEALTH</p>
          <h1>Everything in tune.</h1>
          <p class="lede">Live uptime checks for Geet web, API and development.</p>
        </div>
        <button id="refresh" class="refresh-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4.9 9a7.5 7.5 0 0 1 12.8-2.1L20 12M4 17v-5h5m10.1 3a7.5 7.5 0 0 1-12.8 2.1L4 12" /></svg>
          <span>Refresh checks</span>
        </button>
      </section>
      <section id="overall" class="overall unknown" aria-live="polite">
        <span class="overall-icon" aria-hidden="true"></span>
        <div class="overall-copy"><strong id="overall-title">Checking Geet…</strong><span id="overall-description">Loading monitor status.</span></div>
        <span id="checked-at" class="checked-at">First check</span>
      </section>
      <section id="monitors" class="monitors" aria-label="Monitors" aria-busy="true"></section>
      <footer class="footer"><span>Geet · Music sounds better together.</span><span>Powered by UptimeRobot</span></footer>
    </main>
  </body>
</html>
